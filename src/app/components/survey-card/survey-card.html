<div class="survey-card">
  <section class="survey-card__top">
    <span class="survey-card__category">{{ survey().category }}</span>
    <h3 class="survey-card__title">{{ survey().title }}</h3>
  </section>
  <section class="survey-card__bottom">
    <p class="survey-card__expiring-date">{{ survey().expires_at }}</p>
  </section>
</div>
